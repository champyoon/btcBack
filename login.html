<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>로그인 | BTCBack</title>
  <style>
    :root { color-scheme:dark; --orange:#f7931a; }
    * { box-sizing:border-box; letter-spacing:0; }
    body { margin:0; background:#0b0c0e; color:#f2f3f5; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
    a { color:inherit; text-decoration:none; }
    a:focus-visible { outline:2px solid var(--orange); outline-offset:4px; }

    main { width:min(800px,calc(100% - 48px)); margin:0 auto; padding:44px 0; }
    h1 { font-size:30px; line-height:1.4; margin:0 0 16px; word-break:keep-all; overflow-wrap:anywhere; }
    .policy-meta { color:#989da6; font-size:12px; line-height:1.8; margin:0 0 28px; }
    .policy-meta strong { color:#f7931a; font-weight:500; }
    .policy-section { padding:24px 0; border-top:1px solid #292c31; }
    h2 { margin:0 0 12px; font-size:18px; line-height:1.5; word-break:keep-all; overflow-wrap:anywhere; }
    h2 span { color:#f7931a; font-size:12px; margin-right:12px; }
    .policy-section p { font-size:14px; line-height:1.95; color:#b1b5bd; margin:10px 0 0; word-break:keep-all; overflow-wrap:anywhere; }
    main a { color:#edb574; text-decoration:underline; text-underline-offset:4px; }
    .return-link { display:inline-block; padding:16px 0; font-size:13px; margin-top:12px; }
    footer { border-top:1px solid #292c31; }
    .footer-inner { width:min(1320px,calc(100% - 96px)); margin:auto; display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px 20px; padding:24px 0; font-size:11px; color:#747a83; }

    @media(max-width:700px) { main { width:calc(100% - 36px); padding:28px 0; } h1 { font-size:25px; } .footer-inner { width:calc(100% - 36px); font-size:10px; } }
  
    [hidden] { display:none !important; }
    main { max-width:520px; padding-block:40px; }
    .intro { color:#b1b5bd; font-size:14px; line-height:1.8; }
    .test-notice { border-left:2px solid #a46e2d; padding-left:14px; color:#b8afa2; font-size:12px; line-height:1.8; margin:22px 0; }
    form { margin-top:26px; }
    .field { margin-bottom:18px; }
    .field label { display:block; margin-bottom:8px; font-size:13px; }
    input[type=email],input[type=password] { display:block; width:100%; min-height:48px; border:1px solid #34373d; border-radius:6px; background:#14161a; color:#f2f3f5; padding:12px 14px; font:inherit; font-size:16px; }
    input:focus-visible,button:focus-visible { outline:2px solid #f7931a; outline-offset:3px; }
    fieldset { border:0; padding:18px 0; margin:0; min-width:0; }
    legend { font-size:13px; font-weight:600; padding:0; }
    .consent { display:flex; gap:10px; align-items:flex-start; min-height:44px; padding:10px 0; font-size:13px; line-height:1.7; }
    .consent input { flex-shrink:0; width:18px; height:18px; margin:2px 0 0; accent-color:#f7931a; }
    .consent-note { font-size:12px; line-height:1.8; color:#989da6; margin:2px 0 10px 28px; }
    .submit { width:100%; min-height:52px; border:0; border-radius:6px; background:#f7931a; color:#15100a; font:inherit; font-size:15px; font-weight:700; cursor:pointer; }
    .submit:hover { background:#ffab43; }
    .submit:disabled { opacity:.55; cursor:wait; }
    .message { font-size:14px; line-height:1.9; overflow-wrap:anywhere; margin:18px 0 0; }
    .message.error { color:#f3aaa3; }
    .message.success { color:#b7d1c3; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="admin-config.js" defer></script>
  <script src="member-auth.js" defer></script>
  <link rel="stylesheet" href="member-auth.css">
<link rel="stylesheet" href="common.css">
</head>
<body>
  <header class="site-header"><div class="site-header-inner">
    <a href="index.html" class="site-brand" aria-label="BTCBack 홈"><div class="site-logo">BTC<span>Back</span></div><div class="site-tagline">Shop Today. Stack Tomorrow.</div></a>
<nav class="site-nav" aria-label="메인 메뉴"><a href="index.html">홈</a><a href="shopping.html">쇼핑하기</a><a href="dashboard.html">My BTCBack</a><a href="about.html">BTCBack은?</a><span class="site-auth-slot"><a class="site-auth-entry" href="login.html">로그인</a><button id="member-logout" type="button" hidden>로그아웃</button></span></nav>
  </div></header>
  <main>
    <p class="policy-meta"><strong>MY BTCBACK</strong></p>
    <h1>로그인</h1>
    <p class="intro">이메일과 비밀번호로 BTCBack에 로그인하세요.</p>
    <p id="member-status" role="status" aria-live="polite">회원 상태를 확인하고 있습니다.</p>
    <form id="login-form" hidden>
      <div class="field"><label for="email">이메일</label><input id="email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="submit" id="login-submit" type="submit">로그인</button>
    </form>
    <div class="member-controls"><button id="member-retry" type="button" hidden>상태 다시 확인</button></div>
    <p class="intro">아직 계정이 없으신가요? <a href="signup.html">회원가입</a></p>
    <noscript><p>로그인하려면 JavaScript를 활성화해 주세요.</p></noscript>
  </main>
  <footer><div class="footer-inner"><span>© 2026 BTCBack</span><span>Shop Today. Stack Tomorrow.</span></div><nav class="policy-links" aria-label="정책 메뉴"><a href="terms.html">이용약관</a><a href="privacy.html">개인정보처리방침</a><a href="reward-policy.html">Reward Policy</a><a href="affiliate-disclosure.html">Affiliate Disclosure</a></nav><p class="footer-support">문의 <a href="mailto:support@btcback.kr">support@btcback.kr</a></p></footer>
</body>
</html>
