<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTCBack | Reward 신청 종료</title>
  <meta name="description" content="기존 수동 Reward 신청 기능이 종료되었습니다.">

  <style>
    :root { color-scheme:dark; --bg:#0b0c0e; --text:#f2f3f5; --muted:#989da6; --orange:#f7931a; --line:#292c31; }
    * { box-sizing:border-box; letter-spacing:0; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
    a { color:inherit; text-decoration:none; }
    button,input,select,textarea { font:inherit; }
    a:focus-visible,button:focus-visible { outline:2px solid var(--orange); outline-offset:5px; }
    [hidden] { display:none !important; }
    .container { width:min(1120px,calc(100% - 64px)); margin-inline:auto; }
    header { border-bottom:1px solid var(--line); }
    .header-inner { min-height:88px; display:flex; align-items:center; justify-content:space-between; gap:24px; }
    .logo { font-size:28px; font-weight:800; line-height:1.1; }
    .logo span { color:var(--orange); }
    .tagline { margin-top:7px; font-size:10px; color:var(--muted); }
    nav { display:flex; gap:28px; align-items:center; font-size:13px; color:#b1b5bd; }
    nav a { padding-block:14px; }
    nav a:hover { color:var(--orange); }
    main { max-width:880px; margin:auto; padding:42px 32px 64px; }
    .heading { margin-bottom:28px; }
    .eyebrow { color:var(--orange); font-size:11px; margin:0 0 12px; }
    h1 { font-size:30px; line-height:1.5; margin:0 0 12px; word-break:keep-all; }
    h1 span { color:var(--orange); }
    .intro { font-size:13px; line-height:1.8; color:var(--muted); margin:0; word-break:keep-all; }
    .demo-note { border-left:2px solid #9b682e; padding:2px 0 2px 14px; margin:20px 0 0; font-size:12px; line-height:1.8; color:#b8a58d; word-break:keep-all; }
    .form-panel { border:1px solid #34373d; border-radius:8px; padding:32px; background:linear-gradient(145deg,#1b1d21,#111315 85%); box-shadow:0 12px 28px #00000025,inset 0 1px 0 #ffffff04; }
    fieldset { margin:0; padding:0; border:0; min-width:0; }
    fieldset+fieldset { margin-top:28px; padding-top:28px; border-top:1px solid var(--line); }
    legend { padding:0; font-size:16px; font-weight:650; margin-bottom:20px; }
    fieldset+fieldset legend { float:left; width:100%; }
    .fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px 24px; clear:both; }
    .field { min-width:0; }
    .full { grid-column:1 / -1; }
    label { display:block; font-size:12px; font-weight:600; margin-bottom:9px; }
    .optional { color:var(--muted); font-weight:400; }
    input,select,textarea { display:block; width:100%; min-width:0; border:1px solid #3a3e45; border-radius:6px; background:#101214; color:var(--text); padding:12px 13px; font-size:14px; outline:none; }
    input,select { min-height:46px; }
    textarea { min-height:94px; resize:vertical; line-height:1.6; }
    input::placeholder,textarea::placeholder { color:#717883; opacity:1; }
    input:focus,select:focus,textarea:focus { border-color:var(--orange); box-shadow:0 0 0 2px #f7931a15; }
    [aria-invalid="true"] { border-color:#e58888; }
    .help { font-size:11px; color:var(--muted); line-height:1.8; margin:8px 0 0; word-break:keep-all; overflow-wrap:anywhere; }
    .error { font-size:12px; color:#f0a0a0; line-height:1.6; margin:7px 0 0; }
    .notice { padding:20px 0; margin:24px 0 0; border-top:1px solid var(--line); font-size:12px; color:var(--muted); line-height:1.8; word-break:keep-all; }
    .button { width:100%; min-height:52px; display:flex; align-items:center; justify-content:center; gap:12px; padding:14px 20px; background:var(--orange); border:0; border-radius:6px; color:#15100a; font-size:15px; font-weight:750; cursor:pointer; }
    .button:hover { background:#ffab43; }
    .button:disabled { opacity:.5; cursor:not-allowed; }
    .submit-caption { margin:12px 0 0; font-size:11px; color:#858b95; text-align:center; line-height:1.7; }
    .success { padding:40px 12px; text-align:center; outline:none; }
    .success-mark { display:grid; place-items:center; margin:0 auto 20px; width:52px; height:52px; border:1px solid #32644f; border-radius:50%; color:#64d5a3; background:#14201b; font-size:24px; }
    .success h2 { font-size:23px; line-height:1.6; margin:0 0 14px; word-break:keep-all; }
    .success p { color:var(--muted); font-size:13px; line-height:1.9; margin:0 0 24px; word-break:keep-all; }
    .success .button { width:fit-content; margin:auto; }
    footer { border-top:1px solid var(--line); }
    .footer-inner { padding-block:24px; display:flex; justify-content:space-between; gap:20px; font-size:11px; color:#747a83; }
    @media(max-width:700px) {
      .container { width:calc(100% - 36px); }
      .header-inner { min-height:78px; gap:16px; }
      .logo { font-size:24px; } .tagline { font-size:8px; }
      nav { gap:16px; font-size:12px; }
      main { padding:30px 18px 42px; }
      h1 { font-size:24px; }
      .form-panel { padding:24px 20px; }
      .fields { grid-template-columns:1fr; gap:20px; }
      input,select,textarea { font-size:16px; }
      .footer-inner { font-size:10px; }
    }
    @media(max-width:360px) { nav { gap:10px; font-size:11px; } .form-panel { padding:22px 16px; } h1 { font-size:22px; } }
    .site-header { position:sticky; top:0; z-index:10; background:rgba(11,12,14,.95); border-bottom:1px solid #252a31; backdrop-filter:blur(16px); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif; }
    .site-header-inner { width:100%; max-width:1416px; height:88px; padding:0 48px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:28px; }
    .site-brand { display:block; flex-shrink:0; color:#fff; text-decoration:none; }
    .site-logo { font-size:28px; font-weight:800; line-height:1.1; letter-spacing:0; }
    .site-logo span { color:#f7931a; }
    .site-tagline { margin-top:7px; font-size:10px; font-weight:400; line-height:1.5; color:#858b95; }
    .site-header .site-nav { display:flex; align-items:center; justify-content:flex-end; gap:32px; width:auto; order:0; }
    .site-header .site-nav a { display:block; padding:14px 0; font-size:13px; font-weight:400; line-height:1.5; letter-spacing:0; white-space:nowrap; color:#b1b5bd; text-decoration:none; background:none; border:0; }
    .site-header .site-nav a:hover { color:#fff; }
    .site-header .site-nav a[aria-current="page"] { color:#f7931a; }
    @media(max-width:850px) {
      .site-header-inner { height:auto; min-height:108px; padding:15px 20px 0; flex-wrap:wrap; gap:12px; }
      .site-header .site-nav { width:100%; justify-content:space-between; flex-wrap:wrap; gap:4px 8px; }
      .site-header .site-nav a { padding:10px 0 13px; font-size:11px; }
    }
  </style>
</head>
<body>
  <header class="site-header"><div class="site-header-inner">
    <a href="index.html" class="site-brand" aria-label="BTCBack 홈"><div class="site-logo">BTC<span>Back</span></div><div class="site-tagline">Shop Today. Stack Tomorrow.</div></a>
    <nav class="site-nav" aria-label="메인 메뉴"><a href="index.html">홈</a><a href="shopping.html">쇼핑하기</a><a href="reward.html" aria-current="page">Bitcoin 리워드 신청</a><a href="about.html">BTCBack은?</a></nav>
  </div></header>
  <main>
    <div class="heading"><p class="eyebrow">BITCOIN REWARDS</p><h1>Reward 신청 방식이 변경되었습니다.</h1><p class="intro">구매정보를 직접 제출하는 기존 Reward 신청 기능은 종료되었습니다. 제휴 실적 기반 Reward 구조로 전환 중입니다.</p></div>
    <a class="button" href="shopping.html">쇼핑하기로 돌아가기</a>
  </main>
  <footer><div class="footer-inner container"><span>© 2026 BTCBack</span><span>Shop Today. Stack Tomorrow.</span></div></footer>


</body>
</html>
