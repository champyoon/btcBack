<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BTCBack | 쇼핑하고 Bitcoin 받기</title>

  <meta
    name="description"
    content="BTCBack을 통해 쇼핑하고 Bitcoin 리워드를 준비하세요."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #0b0d10;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans KR",
        Arial,
        sans-serif;

      background: #0b0d10;
      color: #ffffff;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #0b0d10;
      border-bottom: 1px solid #252a31;
    }

    .header-inner {
      max-width: 1000px;
      margin: 0 auto;
      padding: 18px 20px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      text-decoration: none;
      color: #ffffff;
    }

    .logo span {
      color: #f7931a;
    }

    .home-link {
      text-decoration: none;
      color: #9ca3af;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .home-link:hover {
      color: #f7931a;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 42px 20px 65px;
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      font-size: 32px;
    }

    .subtitle {
      margin: 0 0 30px;
      text-align: center;
      color: #9ca3af;
      line-height: 1.7;
    }

    /* =========================
       DISCLOSURE
    ========================= */

    .disclosure {
      max-width: 760px;
      margin: 0 auto 30px;
      padding: 14px 18px;

      background: #17130d;
      border: 1px solid #5a3a12;
      border-radius: 10px;

      color: #d1d5db;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    .disclosure strong {
      color: #f7931a;
    }

    /* =========================
       SECTIONS
    ========================= */

    .shopping-section,
    .products-section {
      background: #15181d;
      border: 1px solid #252a31;
      border-radius: 16px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.25);
    }

    .shopping-section {
      padding: 30px 20px;
      margin-bottom: 30px;
    }

    .products-section {
      padding: 32px 20px 38px;
    }

    .shopping-section h2,
    .products-section h2 {
      margin: 0;
      text-align: center;
      font-size: 22px;
    }

    .shopping-section h2 {
      margin-bottom: 22px;
    }

    .products-section h2 {
      margin-bottom: 30px;
    }

    /* =========================
       COUPANG BANNER
    ========================= */

    .banner-wrapper {
      display: flex;
      justify-content: center;
      overflow: hidden;
      border-radius: 8px;
    }

    .banner-wrapper a {
      display: block;
      max-width: 100%;
    }

    .banner-wrapper img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    /* =========================
       PRODUCT GRID
       PC: 5 × 3
    ========================= */

    .product-grid {
      display: grid;
      grid-template-columns: repeat(5, 120px);
      justify-content: center;
      gap: 28px 38px;
    }

    .product-item {
      width: 120px;
      height: 240px;
      overflow: hidden;
      border-radius: 8px;
      background: #ffffff;
    }

    .product-item iframe {
      display: block;
      width: 120px;
      height: 240px;
      border: 0;
    }

    .reward-cta {
      margin-top: 32px;
      padding: 30px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-top: 1px solid rgba(247, 147, 26, 0.3);
      border-bottom: 1px solid rgba(247, 147, 26, 0.3);
      background: linear-gradient(110deg, rgba(247, 147, 26, 0.045), transparent);
      box-shadow: 0 0 24px rgba(247, 147, 26, 0.025);
    }

    .reward-cta h2 {
      margin: 0 0 10px;
      font-size: 22px;
      line-height: 1.4;
      word-break: keep-all;
    }

    .reward-cta p {
      margin: 0;
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.7;
      word-break: keep-all;
    }

    .reward-cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      min-height: 52px;
      padding: 14px 22px;
      border: 1px solid #f7931a;
      border-radius: 6px;
      background: #f7931a;
      color: #15100a;
      font-size: 15px;
      font-weight: 750;
      line-height: 1.5;
      text-align: center;
      text-decoration: none;
    }

    .reward-cta-button:hover {
      background: #ffab43;
      border-color: #ffab43;
    }

    .reward-cta-button:focus-visible {
      outline: 2px solid #f7931a;
      outline-offset: 5px;
    }

    @media (max-width: 700px) {
      .reward-cta {
        flex-direction: column;
        align-items: stretch;
        padding: 26px 16px;
        gap: 20px;
        text-align: center;
      }

      .reward-cta-button {
        width: 100%;
      }
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 800px) {
      .product-grid {
        grid-template-columns: repeat(3, 120px);
        gap: 24px 32px;
      }
    }

    /* =========================
       MOBILE
       3 × 5
    ========================= */

    @media (max-width: 520px) {
      main {
        padding: 30px 12px 50px;
      }

      .header-inner {
        padding: 16px;
      }

      .logo {
        font-size: 22px;
      }

      h1 {
        font-size: 27px;
      }

      .subtitle {
        font-size: 14px;
      }

      .shopping-section,
      .products-section {
        padding-left: 10px;
        padding-right: 10px;
      }

      .product-grid {
        grid-template-columns: repeat(3, 100px);
        gap: 18px 6px;
      }

      .product-item {
        width: 100px;
        height: 200px;
      }

      .product-item iframe {
        transform: scale(0.833333);
        transform-origin: top left;
      }
    }

    /* =========================
       VERY SMALL PHONES
    ========================= */

    @media (max-width: 340px) {
      .product-grid {
        grid-template-columns: repeat(3, 92px);
        gap: 16px 4px;
      }

      .product-item {
        width: 92px;
        height: 184px;
      }

      .product-item iframe {
        transform: scale(0.766667);
        transform-origin: top left;
      }
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #0b0d10;
      border-top: 1px solid #1d2127;

      text-align: center;
      padding: 30px 20px 40px;

      color: #6b7280;
      font-size: 13px;
      line-height: 1.7;
    }

    .bitcoin {
      color: #f7931a;
    }
  </style>
</head>
