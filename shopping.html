    * {

    }

    body {

        "Noto Sans KR",
        Arial,

      background: #f7f7f7;
      color: #111;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #ffffff;
      border-bottom: 1px solid #e8e8e8;
    }

    .header-inner {
      max-width: 1000px;
      margin: 0 auto;
      padding: 18px 20px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      text-decoration: none;
      color: #111;
    }

    .logo span {
      color: #f7931a;
    }

    .home-link {
      text-decoration: none;
      color: #666;
      font-size: 14px;
      font-weight: 600;
    }

    .home-link:hover {
      color: #111;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 36px 20px 60px;
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 30px;
    }

    .subtitle {
      margin: 0 0 28px;
      text-align: center;
      color: #666;
      line-height: 1.6;
    }

    /* =========================
       DISCLOSURE
    ========================= */

    .disclosure {
      max-width: 760px;
      margin: 0 auto 28px;
      padding: 14px 18px;

      background: #fff7e8;
      border: 1px solid #f3d6a5;
      border-radius: 10px;

      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    .disclosure strong {
      color: #d46b00;
    }

    /* =========================
       COUPANG BANNER
    ========================= */

    .shopping-section {
      background: #ffffff;
      border-radius: 16px;
      padding: 30px 20px;
      margin-bottom: 30px;

      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.05);
    }

    .shopping-section h2 {
      margin: 0 0 22px;
      text-align: center;
      font-size: 22px;
    }

    .banner-wrapper {
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    .banner-wrapper img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    /* =========================
       PRODUCT GRID
    ========================= */

    .products-section {
      background: #ffffff;
      border-radius: 16px;
      padding: 30px 20px;

      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.05);
    }

    .products-section h2 {
      margin: 0 0 28px;
      text-align: center;
      font-size: 22px;
    }

    /*
      PC
      5 columns × 3 rows
    */

    .product-grid {
      display: grid;
      grid-template-columns: repeat(5, 120px);
      justify-content: center;

      gap: 28px 38px;
    }

    .product-item {
      width: 120px;
      height: 240px;
      overflow: hidden;
    }

    .product-item iframe {
      display: block;
      width: 120px;
      height: 240px;
      border: 0;
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 800px) {

      .product-grid {
        grid-template-columns: repeat(3, 120px);
        gap: 24px 32px;
      }

    }

    /* =========================
       MOBILE
       3 columns × 5 rows
    ========================= */

    @media (max-width: 520px) {

      main {
        padding: 26px 12px 45px;
      }

      .header-inner {
        padding: 16px;
      }

      .logo {
        font-size: 22px;
      }

      h1 {
        font-size: 26px;
      }

      .subtitle {
        font-size: 14px;
      }

      .shopping-section,
      .products-section {
        padding: 24px 10px;
      }

      .product-grid {
        grid-template-columns: repeat(3, 100px);
        gap: 18px 6px;
      }

      .product-item {
        width: 100px;
        height: 200px;
      }

      .product-item iframe {
        transform: scale(0.833333);
        transform-origin: top left;
      }

    }

    /*
      Very small phones
    */

    @media (max-width: 340px) {

      .product-grid {
        grid-template-columns: repeat(3, 92px);
        gap: 16px 4px;
      }

      .product-item {
        width: 92px;
        height: 184px;
      }

      .product-item iframe {
        transform: scale(0.766667);
        transform-origin: top left;
      }

    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      text-align: center;
      padding: 30px 20px 40px;
      color: #888;
      font-size: 13px;
    }

  </style>
</head>
