<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTCBack Shopping</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      text-align: center;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .logo {
      font-size: 36px;
      font-weight: bold;
    }

    .logo span {
      color: #f7931a;
    }

    .back-link {
      color: #aaa;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: #fff;
    }

    .disclosure {
      background: #fff8e8;
      color: #333;
      border: 1px solid #f7931a;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 36px;
      font-size: 14px;
      line-height: 1.6;
      text-align: left;
    }

    .disclosure strong {
      color: #e46f00;
    }

    .section {
      margin-bottom: 48px;
    }

    .section h2 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .coupang-banner {
      width: 100%;
      overflow: hidden;
    }

    .coupang-banner img {
      display: block;
      width: 100%;
      max-width: 728px;
      height: auto;
      margin: 0 auto;
    }

    /* PC: 5열 */
    .product-list {
      display: grid;
      grid-template-columns: repeat(5, 120px);
      gap: 24px 16px;
      justify-content: center;
      align-items: start;
    }

    .product-item {
      width: 120px;
      height: 240px;
      overflow: hidden;
    }

    .product-item iframe {
      display: block;
      width: 120px;
      height: 240px;
      border: 0;
    }

    footer {
      margin-top: 48px;
      font-size: 12px;
      color: #666;
    }

    /* 태블릿: 3열 */
    @media (max-width: 720px) {
      .product-list {
        grid-template-columns: repeat(3, 120px);
        gap: 20px 12px;
      }
    }

    /* 스마트폰: 3열 유지 + 상품 크기 축소 */
    @media (max-width: 440px) {
      body {
        padding: 14px;
      }

      .topbar {
        flex-direction: row;
      }

      .logo {
        font-size: 30px;
      }

      .section h2 {
        font-size: 20px;
      }

      .product-list {
        grid-template-columns: repeat(3, 100px);
        gap: 16px 8px;
      }

      .product-item {
        width: 100px;
        height: 200px;
        overflow: hidden;
      }

      .product-item iframe {
        width: 120px;
        height: 240px;
        transform: scale(0.8333);
        transform-origin: top left;
      }
    }

    /* 아주 작은 화면 */
    @media (max-width: 340px) {
      body {
        padding: 10px;
      }

      .product-list {
        grid-template-columns: repeat(3, 92px);
        gap: 14px 6px;
      }

      .product-item {
        width: 92px;
        height: 184px;
      }

      .product-item iframe {
        transform: scale(0.7667);
        transform-origin: top left;
      }
    }
  </style>
</head>
