# Gateway JWT verification is disabled here; the handler verifies the user's
# JWT with Supabase Auth and requires an APPROVED profile and valid channel.
# Do not disable JWT verification on admin report functions.
[functions.coupang-deeplink-no-subid]
verify_jwt = false

# Public market data only; no user data or database access.
[functions.btc-krw-price]
verify_jwt = false

# Dedicated scheduler endpoint verifies its own scoped secret; not a public sync API.
# Manual sync/orders/cancellations retain the default gateway JWT check.
[functions.coupang-reward-daily]
verify_jwt = false
